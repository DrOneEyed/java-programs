<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Registration Form</title>
    </head>
    <body style = "background-color: #686563">
    <center>
        <h2 style = "color: white">Fill out the required details!</h2>
    </center>
        <div align ="center">
            <form action="MyForm" style="color: #FF7400">
            Email: <input type="text" name="email"> <br> <br>
            Username: <input type="text" name="uname"> <br> <br>
            Password: <input type="password" name="pass"> <br> <br>
            Gender: <input type="radio" name="gender" value="male" checked>
            Male <input type="radio" name="gender" value="female"> Female <input type="radio" name="gender" value="other"> Other <br><br>
            Course: <input type="checkbox" name="course" value="Java">
            Java <input type="checkbox" name="course" value="Python"> Python <input type="checkbox" name="course" value="C++"> C++ <br><br>
            <input type="submit" value="Submit"> <input type="reset">
        </form>
        </div>
    </body>
</html>
